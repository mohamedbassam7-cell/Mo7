<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دوري الدبابات - My Tasks & League</title>
    <style>
        :root {
            --primary-color: #ff9f43;
            --background-color: #f8f9fa;
            --card-color: #ffffff;
            --text-color: #333333;
            --gray-light: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #eee;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .phone-container {
            width: 100%;
            max-width: 412px;
            height: 850px;
            background: var(--background-color);
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 8px solid #222;
            position: relative;
        }

        .header {
            background: var(--card-color);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--gray-light);
        }

        .nav-tabs {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            background: #f0f0f0;
            padding: 5px;
            border-radius: 20px;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 8px 20px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            color: #666;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: var(--primary-color);
            color: white;
        }

        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .page { display: none; }
        .page.active { display: block; }

        .progress-card {
            background: linear-gradient(135deg, #fff3e6, #ffe5cc);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .task-item, .friend-item {
            background: var(--card-color);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .checkbox-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--primary-color);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.3s;
        }

        .checkbox-btn.checked { background: var(--primary-color); color: white; }

        .proof-form { display: flex; flex-direction: column; gap: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group input, .form-group select { padding: 12px; border: 1px solid var(--gray-light); border-radius: 10px; }
        
        .submit-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .badge {
            background: #fff0e6;
            color: var(--primary-color);
            padding: 5px 12px;
            border-radius: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="header">
        <h2 id="header-title">مهامي اليومية</h2>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('tasks', 'مهامي اليومية')">اليوم</button>
            <button class="tab-btn" onclick="switchTab('league', 'الدوري')">الدوري</button>
            <button class="tab-btn" onclick="switchTab('upload', 'إثبات')">إثبات</button>
        </div>
    </div>

    <div class="content">
        <!-- صفحة المهام -->
        <div id="page-tasks" class="page active">
            <div class="progress-card">
                <h3>إنجازك اليوم</h3>
                <p id="progress-text" style="font-size: 24px; font-weight: bold; color: var(--primary-color);">0 / 6 نقاط</p>
                <p id="bonus-text" style="font-size: 12px; margin-top: 5px; color: #555;"></p>
            </div>

            <div class="task-item">
                <div style="display:flex; align-items:center; gap:15px;">
                    <div class="checkbox-btn" onclick="toggleTask(this)"></div>
                    <h4>الذهاب للجيم 🏋️‍♂️</h4>
                </div>
                <span class="badge">+1</span>
            </div>
            <div class="task-item">
                <div style="display:flex; align-items:center; gap:15px;">
                    <div class="checkbox-btn" onclick="toggleTask(this)"></div>
                    <h4>مذاكرة  💻</h4>
                </div>
                <span class="badge">+1</span>
            </div>
            <div class="task-item">
                <div style="display:flex; align-items:center; gap:15px;">
                    <div class="checkbox-btn" onclick="toggleTask(this)"></div>
                    <h4>شرب 3 لتر مياه 💧</h4>
                </div>
                <span class="badge">+1</span>
            </div>
        </div>

        <!-- صفحة الدوري -->
        <div id="page-league" class="page">
            <div class="friend-item" style="border: 2px solid gold;"><div>1. Bassam</div><span class="badge" id="bassam-points">0 نقطة</span></div>
            <div class="friend-item"><div>2. Awad</div><span class="badge">0 نقطة</span></div>
            <div class="friend-item"><div>3. Eyad</div><span class="badge">0 نقطة</span></div>
            <div class="friend-item"><div>4. Wagdy</div><span class="badge">0 نقطة</span></div>
            <div class="friend-item"><div>5. Ziad</div><span class="badge">0 نقطة</span></div>
            <div class="friend-item"><div>6. Saif</div><span class="badge">0 نقطة</span></div>
            <div class="friend-item"><div>7. Marwan</div><span class="badge">0 نقطة</span></div>
        </div>

        <!-- صفحة الإثبات -->
        <div id="page-upload" class="page">
            <form class="proof-form" action="https://formspree.io/f/xkoabejd" method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label>اسمك:</label>
                    <input type="text" name="name" required placeholder="اكتب اسمك هنا">
                </div>
                <div class="form-group">
                    <label>نوع المهمة:</label>
                    <select name="task">
                        <option>الجيم</option>
                        <option>المذاكره اليوميه</option>
                        <option>المياه</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>صورة الإثبات:</label>
                    <input type="file" name="proof" required>
                </div>
                <button type="submit" class="submit-btn">إرسال الإثبات 🚀</button>
            </form>
        </div>
    </div>
</div>

<script>
    function switchTab(tabId, title) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`page-${tabId}`).classList.add('active');
        document.getElementById('header-title').innerText = title;
        event.currentTarget.classList.add('active');
    }

    let completedTasks = 0;
    function toggleTask(element) {
        if (!element.classList.contains('checked')) {
            element.classList.add('checked');
            element.innerHTML = "✓";
            completedTasks++;
        } else {
            element.classList.remove('checked');
            element.innerHTML = "";
            completedTasks--;
        }

        let totalPoints = completedTasks;
        if (completedTasks === 3) {
            totalPoints += 3;
            document.getElementById('bonus-text').innerText = "مبروك! حصلت على مكافأة الـ 3 نقاط كاملة 🎉";
        } else {
            document.getElementById('bonus-text').innerText = "";
        }

        document.getElementById('bassam-points').innerText = `${totalPoints} نقطة`;
        document.getElementById('progress-text').innerText = `${totalPoints} / 6 نقاط`;
    }
</script>

</body>
</html>
